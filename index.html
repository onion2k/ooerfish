<!doctype html>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>
<title>Nuclear Fishin'</title>
<!-- inline, so the browser does not go asking for a /favicon.ico there is none of -->
<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e8863a'/%3E%3C/svg%3E"
/>
<style>
  :root {
    color-scheme: dark;
    --ink: #f1eee6;
    --dim: #a39f94;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: #0b0a10;
    overflow: hidden;
  }
  body {
    font:
      14px/1.5 ui-rounded,
      'SF Pro Rounded',
      system-ui,
      sans-serif;
    color: var(--ink);
  }
  #stage {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
    /* every finger on the canvas is the game's: a drag casts or turns the camera, and the page neither scrolls nor
       cancels it */
    touch-action: none;
    width: 100%;
    height: 100%;
  }
  .panel {
    position: fixed;
    padding: 10px 14px;
    background: rgba(14, 12, 20, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #stats {
    top: 16px;
    right: 16px;
    text-align: right;
    color: var(--dim);
    font-size: 12px;
  }
  #castLine {
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
  }
  /* look or cast, always on the screen, above the hint that says what a drag does now, in a column so a hint of
     two or three lines pushes the button up and not under it; on a phone, where the hint is not, at the top left,
     clear of the lab's panel at the foot and the Reel button at the right */
  #hud {
    position: fixed;
    bottom: 16px;
    left: 16px;
    max-width: min(340px, 40vw);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    pointer-events: none;
  }
  #hud .panel {
    position: static;
  }
  #help {
    color: var(--dim);
    font-size: 13px;
  }
  #modeButton {
    pointer-events: auto;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
    color: var(--ink);
    min-width: 96px;
    min-height: 44px;
    touch-action: manipulation;
  }
  #modeButton:focus-visible {
    outline: 3px solid #9fd0ff;
    outline-offset: 3px;
  }
  /* what the phone is doing, once one has paired: a line under the bucket's count (which ends at 115px, or at 59px on a
     phone), where it is not in the way of the fight and the two never overlap */
  #phoneStatus {
    top: 123px;
    right: 16px;
    font-size: 12px;
    color: var(--dim);
  }
  /* the pairing code over the game: a card that fits a phone's width, with the code as wide as the card */
  #pairing {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    background: rgba(8, 7, 12, 0.78);
    z-index: 10;
  }
  #pairing[hidden] {
    display: none;
  }
  #pairing .card {
    width: min(320px, 100%);
    max-height: 100%;
    overflow: auto;
    padding: 16px;
    background: #1a1824;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 12px;
    text-align: center;
  }
  #pairing h2 {
    margin: 0 0 4px;
    font-size: 17px;
  }
  #pairing p {
    margin: 4px 0 10px;
    color: var(--dim);
    font-size: 13px;
  }
  #pairingQr {
    display: block;
    width: 100%;
    height: auto;
    background: #fff;
    border-radius: 8px;
  }
  #pairingAddress {
    display: block;
    margin-bottom: 12px;
    font-size: 11px;
    color: var(--dim);
    overflow-wrap: anywhere;
    user-select: all;
  }
  #pairingClose {
    font: inherit;
    font-weight: 700;
    color: var(--ink);
    min-width: 96px;
    min-height: 44px;
    cursor: pointer;
  }
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #0b0a10;
    transition: opacity 0.4s;
  }
  #boot.gone {
    opacity: 0;
    pointer-events: none;
  }
  #boot p {
    color: var(--dim);
  }
  #labPanel {
    top: 16px;
    left: 16px;
    max-width: 300px;
    pointer-events: auto;
    padding: 0;
  }
  #labPanel summary {
    padding: 10px 14px;
    cursor: pointer;
    font-weight: 700;
  }
  #lab {
    padding: 0 14px 12px;
  }
  #lab fieldset {
    border: 0;
    margin: 0 0 8px;
    padding: 0;
  }
  #lab legend {
    color: var(--dim);
    font-size: 12px;
    padding: 0 0 4px;
  }
  #lab button {
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 7px;
    padding: 4px 9px;
    margin: 0 4px 4px 0;
    cursor: pointer;
  }
  #lab button[aria-pressed='true'] {
    background: #e8f4ff;
    color: #10202e;
    border-color: #e8f4ff;
  }
  #lab button:focus-visible,
  #lab input:focus-visible {
    outline: 2px solid #9fd0ff;
    outline-offset: 2px;
  }
  #lab input[type='range'] {
    width: 100%;
  }
  #lab .ends {
    display: flex;
    justify-content: space-between;
    color: var(--dim);
    font-size: 11px;
  }
  /* the fight's bar: where it stands beside the Reel button (what it looks like is fight.css's, which the phone's page
     shares) */
  #gauge {
    bottom: 64px;
    right: 124px;
  }
  /* the strike's window open: the button pulses amber by the game's clock, which the page writes as --pulse */
  #reelButton.biting {
    background: color-mix(in srgb, #ffd27a calc(var(--pulse, 0) * 100%), #e8f4ff);
    transform: scale(calc(1 + var(--pulse, 0) * 0.08));
  }
  /* a mark over the bobber while the strike's window is open, placed by the page where the bobber is on the screen */
  #biteMark {
    position: fixed;
    transform: translate(-50%, -100%);
    font-size: 40px;
    font-weight: 800;
    line-height: 1;
    color: #ffd27a;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
    pointer-events: none;
  }
  #reelButton {
    position: fixed;
    right: 24px;
    bottom: 96px;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    font: inherit;
    font-weight: 700;
    font-size: 16px;
    color: #10202e;
    background: #e8f4ff;
    border: 2px solid #10202e;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }
  #reelButton[aria-pressed='true'] {
    background: #ffd27a;
  }
  #catch {
    /* low in the middle, so the fish hanging from the rod and the lake stay in view */
    bottom: 64px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: auto;
    cursor: pointer;
    text-align: center;
    font: inherit;
    color: var(--ink);
    padding: 16px 22px;
    min-width: 220px;
  }
  #catch b {
    display: block;
    font-size: 20px;
    text-transform: capitalize;
  }
  #catch small {
    display: block;
    color: var(--dim);
    margin-top: 8px;
  }
  #reelButton:focus-visible,
  #catch:focus-visible {
    outline: 3px solid #9fd0ff;
    outline-offset: 3px;
  }
  #bucket {
    top: 72px;
    right: 16px;
    font-size: 14px;
  }
  @media (max-width: 600px) {
    #reelButton {
      bottom: 180px;
      right: 16px;
    }
    #gauge {
      bottom: 150px;
      right: 114px;
    }
    #catch {
      bottom: 160px;
    }
    /* above the folded lab panel, which takes the foot of a phone's screen */
    #castLine {
      bottom: 76px;
      max-width: calc(100% - 32px);
    }
    #bucket {
      top: 16px;
    }
    #phoneStatus {
      top: 67px;
    }
    #labPanel {
      top: auto;
      bottom: 16px;
      left: 16px;
      right: 16px;
      max-width: none;
    }
    #help,
    #stats {
      display: none;
    }
    #hud {
      top: 16px;
      bottom: auto;
    }
  }
</style>
<div id="stage"><canvas id="view"></canvas></div>
<details class="panel" id="labPanel" open>
  <summary>Lake lab</summary>
  <div id="lab" hidden></div>
</details>
<div class="panel" id="stats" hidden></div>
<div class="panel" id="castLine" hidden></div>
<div class="panel" id="phoneStatus" role="status" hidden></div>
<div id="pairing" role="dialog" aria-modal="true" aria-labelledby="pairingTitle" hidden>
  <div class="card">
    <h2 id="pairingTitle">Pair a phone</h2>
    <p>Scan this with the phone's camera, open the page it finds and tap Connect.</p>
    <canvas id="pairingQr" width="256" height="256" aria-label="QR code for the phone's address"></canvas>
    <p id="pairingStatus"></p>
    <code id="pairingAddress"></code>
    <button type="button" id="pairingClose">Close</button>
  </div>
</div>
<div id="biteMark" aria-hidden="true" hidden>!</div>
<div class="panel" id="gauge" hidden>
  <div id="gaugeBar" aria-hidden="true">
    <div id="gaugeZone"></div>
    <svg id="gaugeFish" viewBox="-15 -9 30 18">
      <path d="M13 0Q4-8-6-3L-14-8-11 0-14 8-6 3Q4 8 13 0Z" />
      <circle class="eye" cx="7" cy="-1.5" r="1.6" />
    </svg>
  </div>
  <div id="gaugeMeter" role="meter" aria-label="the catch" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30">
    <div id="gaugeMeterFill"></div>
  </div>
  <span id="gaugeWords">in the zone</span>
</div>
<button id="reelButton" type="button" hidden aria-pressed="false">Strike</button>
<button class="panel" id="catch" type="button" hidden>
  <b id="catchName"></b><span id="catchWeight"></span><small>tap to put it in the bucket</small>
</button>
<div class="panel" id="bucket" hidden></div>
<div id="hud">
  <button class="panel" id="modeButton" type="button" hidden>Cast</button>
  <div class="panel" id="help" hidden>drag to look round, wheel to zoom, C to cast</div>
</div>
<div id="boot">
  <p id="bootMsg">starting WebGPU…</p>
</div>
<script type="module" src="/src/main.ts"></script>
