<!doctype html>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>
<title>Nuclear Fishin'</title>
<!-- inline, so the browser does not go asking for a /favicon.ico there is none of -->
<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e8863a'/%3E%3C/svg%3E"
/>
<style>
  :root {
    color-scheme: dark;
    --ink: #f1eee6;
    --dim: #a39f94;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: #0b0a10;
    overflow: hidden;
  }
  body {
    font:
      14px/1.5 ui-rounded,
      'SF Pro Rounded',
      system-ui,
      sans-serif;
    color: var(--ink);
  }
  #stage {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
    /* every finger on the canvas is the game's: a drag casts or turns the camera, and the page neither scrolls nor
       cancels it */
    touch-action: none;
    width: 100%;
    height: 100%;
  }
  .panel {
    position: fixed;
    padding: 10px 14px;
    background: rgba(14, 12, 20, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #castLine {
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
  }
  /* look or cast, always on the screen, above the hint that says what a drag does now, in a column so a hint of
     two or three lines pushes the button up and not under it; on a phone, where the hint is not, at the top left,
     clear of the Reel button at the right */
  #hud {
    position: fixed;
    bottom: 16px;
    left: 16px;
    max-width: min(340px, 40vw);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    pointer-events: none;
  }
  #hud .panel {
    position: static;
  }
  #help {
    color: var(--dim);
    font-size: 13px;
  }
  #modeButton {
    pointer-events: auto;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
    color: var(--ink);
    min-width: 96px;
    min-height: 44px;
    touch-action: manipulation;
  }
  #modeButton:focus-visible {
    outline: 3px solid #9fd0ff;
    outline-offset: 3px;
  }
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #0b0a10;
    transition: opacity 0.4s;
  }
  #boot.gone {
    opacity: 0;
    pointer-events: none;
  }
  #boot p {
    color: var(--dim);
  }
  /* the pond: the glow gauge at the top left, a bar that empties as the lake is cleaned (the dark part covers the
     glow that has gone, from the right), and the welcome and the line for a cure, centred at the top */
  #pond {
    top: 16px;
    left: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #pond[hidden] {
    display: none;
  }
  #pondIcon {
    width: 26px;
    height: 26px;
    flex: none;
    fill: #9fe04a;
    stroke: #9fe04a;
  }
  #pond.clean #pondIcon {
    fill: #5fd0ff;
    stroke: #5fd0ff;
  }
  #pondBar {
    position: relative;
    width: 150px;
    height: 10px;
    margin-top: 2px;
    border-radius: 99px;
    overflow: hidden;
    background: linear-gradient(90deg, #5fd0ff, #6fe3a0 55%, #9fe04a);
  }
  #pondBarGone {
    position: absolute;
    top: 0;
    bottom: 0;
    right: 0;
    width: 0;
    background: rgba(14, 12, 20, 0.75);
  }
  #welcome,
  #toast {
    left: 50%;
    top: 26px;
    transform: translateX(-50%);
    text-align: center;
    font-size: 16px;
  }
  #welcome {
    /* the lines of a sentence of this length are evened, so a word is not left alone on the second */
    text-wrap: balance;
    width: 520px;
    max-width: calc(100% - 32px);
  }
  #welcome small {
    color: var(--dim);
    font-size: 14px;
  }
  #toast {
    top: 80px;
    white-space: nowrap;
  }
  #toast b {
    color: #8fe3ff;
  }
  /* the fight: the bar beside the Reel button, upright, the zone the reel pushes up it and the fish darting on it,
     the meter beside it filling while the fish is in the zone, and words below so position is not all it says */
  #gauge {
    bottom: 64px;
    right: 124px;
    /* a width of its own, room for the longer words, so the bar does not move as they change */
    width: 116px;
    box-sizing: border-box;
    display: grid;
    justify-content: center;
    /* fixed columns, the bar's and the meter's: the words span them without widening them */
    --bar-width: 36px;
    --meter-width: 10px;
    grid-template-columns: var(--bar-width) var(--meter-width);
    gap: 6px 8px;
    justify-items: center;
    font-size: 12px;
    padding: 10px 10px 8px;
  }
  /* its grid would otherwise show it while hidden */
  #gauge[hidden] {
    display: none;
  }
  #gaugeBar,
  #gaugeMeter {
    position: relative;
    height: 280px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.12);
    overflow: hidden;
  }
  #gaugeBar {
    width: var(--bar-width);
  }
  #gaugeMeter {
    width: var(--meter-width);
  }
  #gaugeZone {
    position: absolute;
    left: 0;
    right: 0;
    border-radius: 6px;
    background: rgba(232, 244, 255, 0.32);
    border: 2px solid rgba(232, 244, 255, 0.85);
    box-sizing: border-box;
  }
  /* a side-on fish, nose to the right, centred on where it is on the bar */
  #gaugeFish {
    position: absolute;
    left: 50%;
    width: 30px;
    height: 18px;
    margin: 0 0 -9px -15px;
    overflow: visible;
  }
  #gaugeFish .eye {
    fill: #1d3b33;
  }
  /* the strike's window open: the button pulses amber by the game's clock, which the page writes as --pulse */
  #reelButton.biting {
    background: color-mix(in srgb, #ffd27a calc(var(--pulse, 0) * 100%), #e8f4ff);
    transform: scale(calc(1 + var(--pulse, 0) * 0.08));
  }
  /* a mark over the bobber while the strike's window is open, placed by the page where the bobber is on the screen */
  #biteMark {
    position: fixed;
    transform: translate(-50%, -100%);
    font-size: 40px;
    font-weight: 800;
    line-height: 1;
    color: #ffd27a;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
    pointer-events: none;
  }
  #gaugeMeterFill {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: #9fe08a;
  }
  #gaugeWords {
    grid-column: 1 / -1;
    color: var(--dim);
    white-space: nowrap;
  }
  #reelButton {
    position: fixed;
    right: 24px;
    bottom: 96px;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    font: inherit;
    font-weight: 700;
    font-size: 16px;
    color: #10202e;
    background: #e8f4ff;
    border: 2px solid #10202e;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }
  #reelButton[aria-pressed='true'] {
    background: #ffd27a;
  }
  #catch {
    /* low in the middle, so the fish hanging from the rod and the lake stay in view */
    bottom: 64px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: auto;
    cursor: pointer;
    text-align: center;
    font: inherit;
    color: var(--ink);
    padding: 16px 22px;
    min-width: 220px;
  }
  #catch b {
    display: block;
    font-size: 20px;
    text-transform: capitalize;
  }
  #catch small {
    display: block;
    color: var(--dim);
    margin-top: 8px;
  }
  #reelButton:focus-visible,
  #catch:focus-visible {
    outline: 3px solid #9fd0ff;
    outline-offset: 3px;
  }
  #bucket {
    top: 16px;
    right: 16px;
    font-size: 14px;
  }
  @media (max-width: 600px) {
    #reelButton {
      bottom: 180px;
      right: 16px;
    }
    #gauge {
      bottom: 150px;
      right: 114px;
    }
    #catch {
      bottom: 160px;
    }
    #castLine {
      bottom: 76px;
      max-width: calc(100% - 32px);
    }
    #help {
      display: none;
    }
    /* the pond's gauge takes the top left, so the Cast button stands under it, and the lines under that */
    #hud {
      top: 76px;
      bottom: auto;
    }
    #welcome,
    #toast {
      top: 134px;
    }
    #toast {
      white-space: normal;
      width: calc(100% - 32px);
    }
  }
</style>
<div id="stage"><canvas id="view"></canvas></div>
<div class="panel" id="pond" hidden>
  <svg id="pondIcon" viewBox="-50 -50 100 100" aria-hidden="true">
    <g fill="none" stroke-width="7">
      <ellipse rx="44" ry="15" />
      <ellipse rx="44" ry="15" transform="rotate(60)" />
      <ellipse rx="44" ry="15" transform="rotate(-60)" />
    </g>
    <circle r="12" stroke="none" />
  </svg>
  <div>
    <div id="pondName"></div>
    <div id="pondBar"><div id="pondBarGone"></div></div>
  </div>
</div>
<div class="panel" id="welcome" hidden>
  Welcome home. The pond's fish are glowing: catch them to clean it up.<br /><small>press Cast, or C, to start</small>
</div>
<div class="panel" id="toast" hidden></div>
<div class="panel" id="castLine" hidden></div>
<div id="biteMark" aria-hidden="true" hidden>!</div>
<div class="panel" id="gauge" hidden>
  <div id="gaugeBar" aria-hidden="true">
    <div id="gaugeZone"></div>
    <svg id="gaugeFish" viewBox="-15 -9 30 18">
      <path d="M13 0Q4-8-6-3L-14-8-11 0-14 8-6 3Q4 8 13 0Z" />
      <circle class="eye" cx="7" cy="-1.5" r="1.6" />
    </svg>
  </div>
  <div id="gaugeMeter" role="meter" aria-label="the catch" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30">
    <div id="gaugeMeterFill"></div>
  </div>
  <span id="gaugeWords">in the zone</span>
</div>
<button id="reelButton" type="button" hidden aria-pressed="false">Strike</button>
<button class="panel" id="catch" type="button" hidden>
  <b id="catchName"></b><span id="catchWeight"></span><small>tap to cure it and put it in the bucket</small>
</button>
<div class="panel" id="bucket" hidden></div>
<div id="hud">
  <button class="panel" id="modeButton" type="button" hidden>Cast</button>
  <div class="panel" id="help" hidden>drag to look round, wheel to zoom, C to cast</div>
</div>
<div id="boot">
  <p id="bootMsg">starting WebGPU…</p>
</div>
<script type="module" src="/src/main.ts"></script>
