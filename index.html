<!doctype html>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>
<title>Nuclear Fishin'</title>
<!-- inline, so the browser does not go asking for a /favicon.ico there is none of -->
<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e8863a'/%3E%3C/svg%3E"
/>
<style>
  :root {
    color-scheme: dark;
    --ink: #f1eee6;
    --dim: #a39f94;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: #0b0a10;
    overflow: hidden;
  }
  body {
    font:
      14px/1.5 ui-rounded,
      'SF Pro Rounded',
      system-ui,
      sans-serif;
    color: var(--ink);
  }
  #stage {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
    /* every finger on the canvas is the game's: a drag casts or turns the camera, and the page neither scrolls nor
       cancels it */
    touch-action: none;
    width: 100%;
    height: 100%;
  }
  .panel {
    position: fixed;
    padding: 10px 14px;
    background: rgba(14, 12, 20, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #castLine {
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
  }
  /* look or cast, always on the screen, above the hint that says what a drag does now, in a column so a hint of
     two or three lines pushes the button up and not under it; on a phone, where the hint is not, at the top left,
     clear of the Reel button at the right */
  #hud {
    position: fixed;
    bottom: 16px;
    left: 16px;
    max-width: min(340px, 40vw);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    pointer-events: none;
  }
  #hud .panel {
    position: static;
  }
  #help {
    color: var(--dim);
    font-size: 13px;
  }
  #modeButton {
    pointer-events: auto;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
    color: var(--ink);
    min-width: 96px;
    min-height: 44px;
    touch-action: manipulation;
  }
  #modeButton:focus-visible {
    outline: 3px solid #9fd0ff;
    outline-offset: 3px;
  }
  /* what the phone is doing, once one has paired: a line under the menu and the bucket's count (which end at 60px),
     where it is not in the way of the fight and never over either */
  #phoneStatus {
    top: 68px;
    right: 16px;
    font-size: 12px;
    color: var(--dim);
  }
  /* the pairing code over the game: a card that fits a phone's width, with the code as wide as the card */
  #pairing {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    background: rgba(8, 7, 12, 0.78);
    z-index: 10;
  }
  #pairing[hidden] {
    display: none;
  }
  #pairing .card {
    width: min(320px, 100%);
    max-height: 100%;
    overflow: auto;
    padding: 16px;
    background: #1a1824;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 12px;
    text-align: center;
  }
  #pairing h2 {
    margin: 0 0 4px;
    font-size: 17px;
  }
  #pairing p {
    margin: 4px 0 10px;
    color: var(--dim);
    font-size: 13px;
  }
  #pairingQr {
    display: block;
    width: 100%;
    height: auto;
    background: #fff;
    border-radius: 8px;
  }
  #pairingAddress {
    display: block;
    margin-bottom: 12px;
    font-size: 11px;
    color: var(--dim);
    overflow-wrap: anywhere;
    user-select: all;
  }
  #pairingClose {
    font: inherit;
    font-weight: 700;
    color: var(--ink);
    min-width: 96px;
    min-height: 44px;
    cursor: pointer;
  }
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #0b0a10;
    transition: opacity 0.4s;
  }
  #boot.gone {
    opacity: 0;
    pointer-events: none;
  }
  #boot p {
    color: var(--dim);
  }
  /* the pond: the glow gauge at the top left, a bar that empties as the lake is cleaned (the dark part covers the
     glow that has gone, from the right), and the welcome and the line for a cure, centred at the top */
  #pond {
    top: 16px;
    left: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #pond[hidden] {
    display: none;
  }
  #pondIcon {
    width: 26px;
    height: 26px;
    flex: none;
    fill: #9fe04a;
    stroke: #9fe04a;
  }
  #pond.clean #pondIcon {
    fill: #5fd0ff;
    stroke: #5fd0ff;
  }
  #pondBar {
    position: relative;
    width: 150px;
    height: 10px;
    margin-top: 2px;
    border-radius: 99px;
    overflow: hidden;
    background: linear-gradient(90deg, #5fd0ff, #6fe3a0 55%, #9fe04a);
  }
  #pondBarGone {
    position: absolute;
    top: 0;
    bottom: 0;
    right: 0;
    width: 0;
    background: rgba(14, 12, 20, 0.75);
  }
  #welcome,
  #toast {
    left: 50%;
    top: 26px;
    transform: translateX(-50%);
    text-align: center;
    font-size: 16px;
  }
  #welcome {
    /* the lines of a sentence of this length are evened, so a word is not left alone on the second */
    text-wrap: balance;
    width: 520px;
    max-width: calc(100% - 32px);
  }
  #welcome small {
    color: var(--dim);
    font-size: 14px;
  }
  #toast {
    top: 80px;
    white-space: nowrap;
  }
  #toast b {
    color: #8fe3ff;
  }
  /* the fight's bar: where it stands beside the Reel button (what it looks like is fight.css's, which the phone's page
     shares) */
  #gauge {
    bottom: 64px;
    right: 124px;
  }
  /* the strike's window open: the button pulses amber by the game's clock, which the page writes as --pulse */
  #reelButton.biting {
    background: color-mix(in srgb, #ffd27a calc(var(--pulse, 0) * 100%), #e8f4ff);
    transform: scale(calc(1 + var(--pulse, 0) * 0.08));
  }
  /* a mark over the bobber while the strike's window is open, placed by the page where the bobber is on the screen */
  #biteMark {
    position: fixed;
    transform: translate(-50%, -100%);
    font-size: 40px;
    font-weight: 800;
    line-height: 1;
    color: #ffd27a;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
    pointer-events: none;
  }
  #reelButton {
    position: fixed;
    right: 24px;
    bottom: 96px;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    font: inherit;
    font-weight: 700;
    font-size: 16px;
    color: #10202e;
    background: #e8f4ff;
    border: 2px solid #10202e;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }
  #reelButton[aria-pressed='true'] {
    background: #ffd27a;
  }
  #catch {
    /* low in the middle, so the fish hanging from the rod and the lake stay in view */
    bottom: 64px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: auto;
    cursor: pointer;
    text-align: center;
    font: inherit;
    color: var(--ink);
    padding: 16px 22px;
    min-width: 220px;
  }
  #catch b {
    display: block;
    font-size: 20px;
    text-transform: capitalize;
  }
  #catch small {
    display: block;
    color: var(--dim);
    margin-top: 8px;
  }
  #reelButton:focus-visible,
  #catch:focus-visible {
    outline: 3px solid #9fd0ff;
    outline-offset: 3px;
  }
  #bucket {
    top: 16px;
    right: 72px;
    font-size: 14px;
  }
  /* what not every player wants (pairing a phone) is behind one small button in the corner, out of the way of play */
  #menu {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  #menu[hidden] {
    display: none;
  }
  #menu .panel {
    position: static;
  }
  #menuButton {
    pointer-events: auto;
    cursor: pointer;
    font: inherit;
    font-size: 20px;
    line-height: 1;
    color: var(--ink);
    width: 44px;
    height: 44px;
    padding: 0;
    touch-action: manipulation;
  }
  #menuList {
    pointer-events: auto;
    display: flex;
    flex-direction: column;
    padding: 6px;
  }
  #menuList[hidden] {
    display: none;
  }
  #menuList button {
    cursor: pointer;
    font: inherit;
    color: var(--ink);
    background: none;
    border: 0;
    border-radius: 8px;
    padding: 10px 14px;
    min-height: 44px;
    text-align: left;
    white-space: nowrap;
  }
  #menuList button:hover,
  #menuList button:focus-visible {
    background: rgba(255, 255, 255, 0.12);
  }
  #menuButton:focus-visible,
  #menuList button:focus-visible {
    outline: 3px solid #9fd0ff;
    outline-offset: 2px;
  }
  @media (max-width: 600px) {
    #reelButton {
      bottom: 180px;
      right: 16px;
    }
    #gauge {
      bottom: 150px;
      right: 114px;
    }
    #catch {
      bottom: 160px;
    }
    #castLine {
      bottom: 76px;
      max-width: calc(100% - 32px);
    }
    #help {
      display: none;
    }
    /* the pond's gauge takes the top left, so the Cast button stands under it, and the lines under that */
    #hud {
      top: 76px;
      bottom: auto;
    }
    #welcome,
    #toast {
      top: 134px;
    }
    /* the gauge is too wide for the bucket to stand left of the menu here, so the bucket keeps the corner and the menu
       and the phone's line take the Cast button's row, on the right */
    #bucket {
      right: 16px;
    }
    #menu {
      top: 76px;
    }
    #phoneStatus {
      top: 80px;
      right: 72px;
    }
    #toast {
      white-space: normal;
      width: calc(100% - 32px);
    }
  }
</style>
<div id="stage"><canvas id="view"></canvas></div>
<div class="panel" id="pond" hidden>
  <svg id="pondIcon" viewBox="-50 -50 100 100" aria-hidden="true">
    <g fill="none" stroke-width="7">
      <ellipse rx="44" ry="15" />
      <ellipse rx="44" ry="15" transform="rotate(60)" />
      <ellipse rx="44" ry="15" transform="rotate(-60)" />
    </g>
    <circle r="12" stroke="none" />
  </svg>
  <div>
    <div id="pondName"></div>
    <div id="pondBar"><div id="pondBarGone"></div></div>
  </div>
</div>
<div class="panel" id="welcome" hidden>
  Welcome home. The pond's fish are glowing: catch them to clean it up.<br /><small>press Cast, or C, to start</small>
</div>
<div class="panel" id="toast" hidden></div>
<div class="panel" id="castLine" hidden></div>
<div class="panel" id="phoneStatus" role="status" hidden></div>
<div id="pairing" role="dialog" aria-modal="true" aria-labelledby="pairingTitle" hidden>
  <div class="card">
    <h2 id="pairingTitle">Pair a phone</h2>
    <p>Scan this with the phone's camera, open the page it finds and tap Connect.</p>
    <canvas id="pairingQr" width="256" height="256" aria-label="QR code for the phone's address"></canvas>
    <p id="pairingStatus"></p>
    <code id="pairingAddress"></code>
    <button type="button" id="pairingClose">Close</button>
  </div>
</div>
<div id="biteMark" aria-hidden="true" hidden>!</div>
<div class="panel" id="gauge" hidden>
  <div id="gaugeBar" aria-hidden="true">
    <div id="gaugeZone"></div>
    <svg id="gaugeFish" viewBox="-15 -9 30 18">
      <path d="M13 0Q4-8-6-3L-14-8-11 0-14 8-6 3Q4 8 13 0Z" />
      <circle class="eye" cx="7" cy="-1.5" r="1.6" />
    </svg>
  </div>
  <div id="gaugeMeter" role="meter" aria-label="the catch" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30">
    <div id="gaugeMeterFill"></div>
  </div>
  <span id="gaugeWords">in the zone</span>
</div>
<button id="reelButton" type="button" hidden aria-pressed="false">Strike</button>
<button class="panel" id="catch" type="button" hidden>
  <b id="catchName"></b><span id="catchWeight"></span><small>tap to cure it and put it in the bucket</small>
</button>
<div class="panel" id="bucket" hidden></div>
<div id="menu">
  <button
    class="panel"
    id="menuButton"
    type="button"
    aria-label="More"
    aria-haspopup="true"
    aria-expanded="false"
    aria-controls="menuList"
  >
    ⋯
  </button>
  <div class="panel" id="menuList" role="menu" hidden>
    <button id="pairButton" type="button" role="menuitem">Pair a phone</button>
  </div>
</div>
<div id="hud">
  <button class="panel" id="modeButton" type="button" hidden>Cast</button>
  <div class="panel" id="help" hidden>drag to look round, wheel to zoom, C to cast</div>
</div>
<div id="boot">
  <p id="bootMsg">starting WebGPU…</p>
</div>
<script type="module" src="/src/main.ts"></script>
