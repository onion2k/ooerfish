<!doctype html>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>
<title>Nuclear Fishin'</title>
<!-- inline, so the browser does not go asking for a /favicon.ico there is none of -->
<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e8863a'/%3E%3C/svg%3E"
/>
<style>
  :root {
    color-scheme: dark;
    --ink: #f1eee6;
    --dim: #a39f94;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: #0b0a10;
    overflow: hidden;
  }
  body {
    font:
      14px/1.5 ui-rounded,
      'SF Pro Rounded',
      system-ui,
      sans-serif;
    color: var(--ink);
  }
  #stage {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
    /* every finger on the canvas is the game's: a drag casts or turns the camera, and the page neither scrolls nor
       cancels it */
    touch-action: none;
    width: 100%;
    height: 100%;
  }
  .panel {
    position: fixed;
    padding: 10px 14px;
    background: rgba(14, 12, 20, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #stats {
    top: 16px;
    right: 16px;
    text-align: right;
    color: var(--dim);
    font-size: 12px;
  }
  #castLine {
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
  }
  #help {
    bottom: 16px;
    left: 16px;
    color: var(--dim);
    font-size: 13px;
  }
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #0b0a10;
    transition: opacity 0.4s;
  }
  #boot.gone {
    opacity: 0;
    pointer-events: none;
  }
  #boot p {
    color: var(--dim);
  }
  #labPanel {
    top: 16px;
    left: 16px;
    max-width: 300px;
    pointer-events: auto;
    padding: 0;
  }
  #labPanel summary {
    padding: 10px 14px;
    cursor: pointer;
    font-weight: 700;
  }
  #lab {
    padding: 0 14px 12px;
  }
  #lab fieldset {
    border: 0;
    margin: 0 0 8px;
    padding: 0;
  }
  #lab legend {
    color: var(--dim);
    font-size: 12px;
    padding: 0 0 4px;
  }
  #lab button {
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 7px;
    padding: 4px 9px;
    margin: 0 4px 4px 0;
    cursor: pointer;
  }
  #lab button[aria-pressed='true'] {
    background: #e8f4ff;
    color: #10202e;
    border-color: #e8f4ff;
  }
  #lab button:focus-visible,
  #lab input:focus-visible {
    outline: 2px solid #9fd0ff;
    outline-offset: 2px;
  }
  #lab input[type='range'] {
    width: 100%;
  }
  #lab .ends {
    display: flex;
    justify-content: space-between;
    color: var(--dim);
    font-size: 11px;
  }
  @media (max-width: 600px) {
    #labPanel {
      top: auto;
      bottom: 16px;
      left: 16px;
      right: 16px;
      max-width: none;
    }
    #help,
    #stats {
      display: none;
    }
  }
</style>
<div id="stage"><canvas id="view"></canvas></div>
<details class="panel" id="labPanel" open>
  <summary>Lake lab</summary>
  <div id="lab" hidden></div>
</details>
<div class="panel" id="stats" hidden></div>
<div class="panel" id="castLine" hidden></div>
<div class="panel" id="help" hidden>drag to look round, wheel to zoom</div>
<div id="boot">
  <p id="bootMsg">starting WebGPU…</p>
</div>
<script type="module" src="/src/main.ts"></script>
