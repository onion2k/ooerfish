<!doctype html>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>
<title>Nuclear Fishin'</title>
<!-- inline, so the browser does not go asking for a /favicon.ico there is none of -->
<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e8863a'/%3E%3C/svg%3E"
/>
<style>
  :root {
    color-scheme: dark;
    --ink: #f1eee6;
    --dim: #a39f94;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: #0b0a10;
    overflow: hidden;
  }
  body {
    font:
      14px/1.5 ui-rounded,
      'SF Pro Rounded',
      system-ui,
      sans-serif;
    color: var(--ink);
  }
  #stage {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
    /* every finger on the canvas is the game's: a drag casts or turns the camera, and the page neither scrolls nor
       cancels it */
    touch-action: none;
    width: 100%;
    height: 100%;
  }
  .panel {
    position: fixed;
    padding: 10px 14px;
    background: rgba(14, 12, 20, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
  #stats {
    top: 16px;
    right: 16px;
    text-align: right;
    color: var(--dim);
    font-size: 12px;
  }
  #castLine {
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 15px;
  }
  /* look or cast, always on the screen, above the hint that says what a drag does now, in a column so a hint of
     two or three lines pushes the button up and not under it; on a phone, where the hint is not, at the top left,
     clear of the lab's panel at the foot and the Reel button at the right */
  #hud {
    position: fixed;
    bottom: 16px;
    left: 16px;
    max-width: min(340px, 40vw);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    pointer-events: none;
  }
  #hud .panel {
    position: static;
  }
  #help {
    color: var(--dim);
    font-size: 13px;
  }
  #modeButton {
    pointer-events: auto;
    cursor: pointer;
    font: inherit;
    font-weight: 700;
    color: var(--ink);
    min-width: 96px;
    min-height: 44px;
    touch-action: manipulation;
  }
  #modeButton:focus-visible {
    outline: 3px solid #9fd0ff;
    outline-offset: 3px;
  }
  #boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: #0b0a10;
    transition: opacity 0.4s;
  }
  #boot.gone {
    opacity: 0;
    pointer-events: none;
  }
  #boot p {
    color: var(--dim);
  }
  #labPanel {
    top: 16px;
    left: 16px;
    max-width: 300px;
    pointer-events: auto;
    padding: 0;
  }
  #labPanel summary {
    padding: 10px 14px;
    cursor: pointer;
    font-weight: 700;
  }
  #lab {
    padding: 0 14px 12px;
  }
  #lab fieldset {
    border: 0;
    margin: 0 0 8px;
    padding: 0;
  }
  #lab legend {
    color: var(--dim);
    font-size: 12px;
    padding: 0 0 4px;
  }
  #lab button {
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 7px;
    padding: 4px 9px;
    margin: 0 4px 4px 0;
    cursor: pointer;
  }
  #lab button[aria-pressed='true'] {
    background: #e8f4ff;
    color: #10202e;
    border-color: #e8f4ff;
  }
  #lab button:focus-visible,
  #lab input:focus-visible {
    outline: 2px solid #9fd0ff;
    outline-offset: 2px;
  }
  #lab input[type='range'] {
    width: 100%;
  }
  #lab .ends {
    display: flex;
    justify-content: space-between;
    color: var(--dim);
    font-size: 11px;
  }
  /* the fight: the bar beside the Reel button, upright, the zone the reel pushes up it and the fish darting on it,
     the meter beside it filling while the fish is in the zone, and words below so position is not all it says */
  #gauge {
    bottom: 64px;
    right: 124px;
    /* a width of its own, room for the longer words, so the bar does not move as they change */
    width: 116px;
    box-sizing: border-box;
    display: grid;
    justify-content: center;
    /* fixed columns, the bar's and the meter's: the words span them without widening them */
    --bar-width: 30px;
    --meter-width: 10px;
    grid-template-columns: var(--bar-width) var(--meter-width);
    gap: 6px 8px;
    justify-items: center;
    font-size: 12px;
    padding: 10px 10px 8px;
  }
  /* its grid would otherwise show it while hidden */
  #gauge[hidden] {
    display: none;
  }
  #gaugeBar,
  #gaugeMeter {
    position: relative;
    height: 180px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.12);
    overflow: hidden;
  }
  #gaugeBar {
    width: var(--bar-width);
  }
  #gaugeMeter {
    width: var(--meter-width);
  }
  #gaugeZone {
    position: absolute;
    left: 0;
    right: 0;
    border-radius: 6px;
    background: rgba(232, 244, 255, 0.32);
    border: 2px solid rgba(232, 244, 255, 0.85);
    box-sizing: border-box;
  }
  #gaugeFish {
    position: absolute;
    left: 50%;
    width: 22px;
    height: 12px;
    margin: 0 0 -6px -11px;
    border-radius: 50%;
  }
  #gaugeMeterFill {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: #9fe08a;
  }
  #gaugeWords {
    grid-column: 1 / -1;
    color: var(--dim);
    white-space: nowrap;
  }
  #reelButton {
    position: fixed;
    right: 24px;
    bottom: 96px;
    width: 88px;
    height: 88px;
    border-radius: 50%;
    font: inherit;
    font-weight: 700;
    font-size: 16px;
    color: #10202e;
    background: #e8f4ff;
    border: 2px solid #10202e;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    cursor: pointer;
  }
  #reelButton[aria-pressed='true'] {
    background: #ffd27a;
  }
  #catch {
    /* low in the middle, so the fish hanging from the rod and the lake stay in view */
    bottom: 64px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: auto;
    cursor: pointer;
    text-align: center;
    font: inherit;
    color: var(--ink);
    padding: 16px 22px;
    min-width: 220px;
  }
  #catch b {
    display: block;
    font-size: 20px;
    text-transform: capitalize;
  }
  #catch small {
    display: block;
    color: var(--dim);
    margin-top: 8px;
  }
  #reelButton:focus-visible,
  #catch:focus-visible {
    outline: 3px solid #9fd0ff;
    outline-offset: 3px;
  }
  #bucket {
    top: 72px;
    right: 16px;
    font-size: 14px;
  }
  @media (max-width: 600px) {
    #reelButton {
      bottom: 180px;
      right: 16px;
    }
    #gauge {
      bottom: 150px;
      right: 114px;
    }
    #catch {
      bottom: 160px;
    }
    /* above the folded lab panel, which takes the foot of a phone's screen */
    #castLine {
      bottom: 76px;
      max-width: calc(100% - 32px);
    }
    #bucket {
      top: 16px;
    }
    #labPanel {
      top: auto;
      bottom: 16px;
      left: 16px;
      right: 16px;
      max-width: none;
    }
    #help,
    #stats {
      display: none;
    }
    #hud {
      top: 16px;
      bottom: auto;
    }
  }
</style>
<div id="stage"><canvas id="view"></canvas></div>
<details class="panel" id="labPanel" open>
  <summary>Lake lab</summary>
  <div id="lab" hidden></div>
</details>
<div class="panel" id="stats" hidden></div>
<div class="panel" id="castLine" hidden></div>
<div class="panel" id="gauge" hidden>
  <div id="gaugeBar" aria-hidden="true">
    <div id="gaugeZone"></div>
    <div id="gaugeFish"></div>
  </div>
  <div id="gaugeMeter" role="meter" aria-label="the catch" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30">
    <div id="gaugeMeterFill"></div>
  </div>
  <span id="gaugeWords">in the zone</span>
</div>
<button id="reelButton" type="button" hidden aria-pressed="false">Strike</button>
<button class="panel" id="catch" type="button" hidden>
  <b id="catchName"></b><span id="catchWeight"></span><small>tap to put it in the bucket</small>
</button>
<div class="panel" id="bucket" hidden></div>
<div id="hud">
  <button class="panel" id="modeButton" type="button" hidden>Cast</button>
  <div class="panel" id="help" hidden>drag to look round, wheel to zoom, C to cast</div>
</div>
<div id="boot">
  <p id="bootMsg">starting WebGPU…</p>
</div>
<script type="module" src="/src/main.ts"></script>
