<!doctype html>
<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
/>
<title>Nuclear Fishin': the rod</title>
<link
  rel="icon"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23e8863a'/%3E%3C/svg%3E"
/>
<style>
  :root {
    color-scheme: dark;
    --ink: #f1eee6;
    --dim: #a39f94;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    height: 100%;
    background: #0b0a10;
    overflow: hidden;
  }
  body {
    position: fixed;
    inset: 0;
    font:
      16px/1.4 ui-rounded,
      'SF Pro Rounded',
      system-ui,
      sans-serif;
    color: var(--ink);
    /* a thumb on the page is the pad's: nothing scrolls, selects or zooms */
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  /* portrait: the line, the word and bar, the pad, the small print; landscape: those on the left, the pad on the right */
  main {
    height: 100%;
    padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    grid-template-areas: 'head' 'show' 'pad' 'foot';
    gap: 12px;
  }
  header {
    grid-area: head;
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: space-between;
  }
  #status {
    margin: 0;
    color: var(--dim);
    font-size: 14px;
    min-width: 0;
  }
  #connect {
    flex: none;
    font: inherit;
    font-weight: 700;
    min-height: 44px;
    padding: 0 20px;
    border-radius: 22px;
    border: 2px solid #10202e;
    background: #e8f4ff;
    color: #10202e;
    touch-action: manipulation;
  }
  #connect:disabled {
    opacity: 0.4;
  }
  #show {
    grid-area: show;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px 16px;
  }
  #word {
    font-size: 40px;
    font-weight: 800;
    min-height: 48px;
    text-align: center;
  }
  /* the bar is fight.css's; here it is only given a shape that fits the screen, and its place in the flow */
  body #gauge {
    background: rgba(14, 12, 20, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
  }
  body #gaugeBar,
  body #gaugeMeter {
    height: clamp(110px, 32dvh, 280px);
  }
  /* the button is the pad here, and has nothing to show of its own */
  #reelButton {
    display: none;
  }
  #pad {
    grid-area: pad;
    min-height: 0;
    border-radius: 20px;
    border: 2px dashed rgba(255, 255, 255, 0.28);
    background: rgba(255, 255, 255, 0.05);
    display: grid;
    place-items: center;
    color: var(--dim);
    text-align: center;
    padding: 12px;
    touch-action: none;
  }
  #pad:active {
    background: rgba(255, 255, 255, 0.1);
  }
  footer {
    grid-area: foot;
    color: var(--dim);
    font-size: 12px;
  }
  footer p {
    margin: 0;
  }
  @media (orientation: landscape) and (max-height: 600px) {
    main {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: 'head pad' 'show pad' 'foot pad';
    }
    body #gaugeBar,
    body #gaugeMeter {
      height: clamp(90px, 38dvh, 280px);
    }
    #word {
      font-size: 32px;
    }
  }
</style>
<main>
  <header>
    <p id="status" role="status"></p>
    <button id="connect" type="button">Connect</button>
  </header>
  <section id="show">
    <div id="word" aria-live="polite"></div>
    <div id="gauge" hidden>
      <div id="gaugeBar" aria-hidden="true">
        <div id="gaugeZone"></div>
        <svg id="gaugeFish" viewBox="-15 -9 30 18">
          <path d="M13 0Q4-8-6-3L-14-8-11 0-14 8-6 3Q4 8 13 0Z" />
          <circle class="eye" cx="7" cy="-1.5" r="1.6" />
        </svg>
      </div>
      <div id="gaugeMeter" role="meter" aria-label="the catch" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="gaugeMeterFill"></div>
      </div>
      <span id="gaugeWords"></span>
    </div>
    <button id="reelButton" type="button" hidden aria-pressed="false">Strike</button>
  </section>
  <div id="pad" role="application" aria-label="The rod: hold to raise it, tap to strike, hold to reel">
    <span id="padHelp">Hold to raise the rod, flick to cast. Tap to strike, hold to reel.</span>
  </div>
  <footer>
    <p id="flick"></p>
    <p id="sensors"></p>
  </footer>
</main>
<script type="module" src="/src/phone/page.ts"></script>
